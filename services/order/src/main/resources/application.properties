server.port=8082
spring.main.banner-mode=off
logging.level.root=WARN
spring.datasource.url=jdbc:postgresql://${PG_HOST:postgres}:5432/${PG_DB:shopverse}
spring.datasource.username=${PG_USER:shop}
spring.datasource.password=${PG_PASSWORD:shoppass}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.initialization-fail-timeout=-1
