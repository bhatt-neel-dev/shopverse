# ShopVerse API gateway — routes per docs/CONTRACTS.md §gateway.
# Strips the /api/<name> prefix and keeps the rest of the path + query string.

log_format shopverse_json escape=json
  '{"ts":"$time_iso8601","level":"INFO","svc":"gateway",'
  '"msg":"$request_method $request_uri $status",'
  '"trace_id":"$http_x_trace_id","method":"$request_method",'
  '"path":"$request_uri","status":$status,'
  '"latency_s":$request_time,"order_id":null,"user_id":null,'
  '"upstream":"$upstream_addr"}';

server {
  listen 8080;
  access_log /dev/stdout shopverse_json;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Trace-Id $http_x_trace_id;
  proxy_connect_timeout 3s;
  proxy_read_timeout 30s;

  location = /health {
    default_type application/json;
    return 200 '{"status":"ok","svc":"gateway"}';
  }

  # /api/catalog/* -> catalog:8081/*
  location /api/catalog/ {
    proxy_pass http://catalog:8081/;
  }

  # /api/orders* -> order:8082/orders*
  location /api/orders {
    proxy_pass http://order:8082/orders;
  }

  # /api/cart/* -> cart:8083/cart/*
  location /api/cart/ {
    proxy_pass http://cart:8083/cart/;
  }

  # /api/search* -> search:8084/search*
  location /api/search {
    proxy_pass http://search:8084/search;
  }

  # /api/pay* -> payment:8085/pay*
  location /api/pay {
    proxy_pass http://payment:8085/pay;
  }

  location / {
    default_type application/json;
    return 404 '{"error":"unknown route"}';
  }
}
