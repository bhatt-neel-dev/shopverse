server {
  listen 9001;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS, with the upstream in a variable: nginx then resolves per request
  # instead of at startup, so the UI survives studio-api being slow or restarted (chaos
  # scenarios restart containers by design).
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $studio_api "studio-api:9000";
    # A variable in proxy_pass disables nginx's automatic location-prefix stripping,
    # so the rewrite has to be explicit or the upstream sees /api/... and 404s.
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$studio_api;
    proxy_http_version 1.1;
    proxy_read_timeout 300s; # bulk trace runs can take minutes
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
